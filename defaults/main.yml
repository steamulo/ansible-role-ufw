---
# defaults file for ufw-firewall

ufw_whitelisted_addresses:
# deal with 2 levels of overriding
ufw_whitelisted_addresses_extra: []

ufw_whitelisted_out_ports: []
# deal with 2 levels of overriding
ufw_whitelisted_out_ports_extra: []

# By default open for all the world for ssh, web and ssl
ufw_whitelisted_in_ports:
  - { to_port: 22, proto: tcp }
  - { to_port: 80, proto: tcp }
  - { to_port: 443, proto: tcp }
# deal with 2 levels of overriding
ufw_whitelisted_in_ports_extra: []

# raw iptables rules evaluated before any rules added via the ufw command
advanced_ufw_before_rules: ""
# raw iptables rules evaluated after any rules added via the ufw command
advanced_ufw_after_rules: ""
# raw iptables rules evaluated before any rules added via the ufw command
ufw_mangle_rules: ""

# raw iptables rules evaluated before any rules added via the ufw command
advanced_ufw_before6_rules: ""
# raw iptables rules evaluated after any rules added via the ufw command
advanced_ufw_after6_rules: ""

ufw_logging: "on"
root_nbd: false

# State of the firewall, can be 'enabled' or 'disabled'
ufw_enable_geoip_blocking: false

# Liste des codes pays ISO 3166-1 alpha-2 autorisés si ufw_enable_geoip_blocking est true
# Si cette liste est vide, la politique GeoIP n'aura pas d'effet de "liste blanche" globale,
# seuls les pays DENIED seront bloqués si ufw_denied_countries est défini.
# Ex: ["FR", "BE", "CH", "CA", "US"]
ufw_allowed_countries: []

# Liste des codes pays ISO 3166-1 alpha-2 à bloquer explicitement si ufw_enable_geoip_blocking est true
# Ex: ["RU", "CN", "KP"]
ufw_denied_countries: []
